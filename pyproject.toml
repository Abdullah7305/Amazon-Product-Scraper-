[project]
name = "ai-scraper"
version = "0.1.0"
description = "Reliable AI-powered Amazon scraper"
requires-python = ">=3.10"
dependencies = ["scrapling", "aiofiles", "scrapy", "google-genai"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
